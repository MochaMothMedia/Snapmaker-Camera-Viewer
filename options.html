<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U1 Camera — Printers</title>
<style>
	body { font-family:system-ui,sans-serif; background:#111; color:#eee; margin:0; padding:24px; }
	.wrap { max-width:560px; margin:0 auto; }
	h1 { font-size:18px; margin:0 0 16px; }
	.add { display:flex; gap:8px; margin-bottom:18px; }
	input { flex:1; background:#222; border:1px solid #333; color:#eee; padding:9px; border-radius:6px; font-size:14px; }
	button { background:#2563eb; border:0; color:#fff; padding:9px 14px; border-radius:6px; font-size:14px; cursor:pointer; }
	button.secondary { background:#333; }
	button.danger { background:#7f1d1d; }
	ul { list-style:none; padding:0; margin:0; }
	li { display:flex; align-items:center; gap:10px; background:#1a1a1a; border:1px solid #2a2a2a; padding:10px 12px; border-radius:8px; margin-bottom:8px; }
	li input.name { flex:1; background:transparent; border:0; color:#eee; font-size:14px; }
	li .ip { color:#9ca3af; font-size:13px; min-width:120px; }
	.links { margin-top:18px; display:flex; gap:10px; }
	#msg { font-size:13px; margin:10px 0; min-height:18px; }
	.ok{color:#4ade80;} .err{color:#f87171;}
	.grant { font-size:12px; color:#fbbf24; }
</style>
</head>
<body>
<div class="wrap">
	<h1>Snapmaker U1 Printers</h1>
	<div class="add">
		<input id="name" placeholder="Name (optional)">
		<input id="ip" placeholder="192.168.1.100" inputmode="decimal">
		<button id="add">Add</button>
	</div>
	<div id="msg"></div>
	<ul id="list"></ul>
	<div class="links">
		<button id="viewer" class="secondary">Open viewer</button>
		<button id="overview" class="secondary">Open overview (grid)</button>
	</div>
</div>
<script src="options.js"></script>
</body>
</html>
